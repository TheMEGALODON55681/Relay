name: keep-demo-warm

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Warm the live deployment
        run: python scripts/warm_deployment.py

      - name: Keep this schedule active
        run: gh workflow enable keep-demo-warm.yml
        env:
          GH_TOKEN: ${{ github.token }}
